name: Precios diarios de fondos y acciones
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'    # cada día a primera hora (UTC)
    - cron: '30 19 * * *'   # y por la tarde-noche, por si el precio del día se publica tarde
  push:
    paths:
      - '.github/workflows/precios.yml'
      - 'tools/precios.py'
      - 'tools/acciones.py'
      - 'tools/acciones.txt'
permissions:
  contents: write
jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: run
        run: python tools/precios.py
        continue-on-error: true
      - id: acc
        run: python tools/acciones.py
        continue-on-error: true
      - name: Guardar precios nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json data/acciones.json
          git diff --cached --quiet || (git commit -m "Precios de fondos y acciones" && git pull --rebase -q && git push)
      - name: Avisar si alguna fuente ha fallado
        if: steps.run.outcome == 'failure' || steps.acc.outcome == 'failure'
        run: echo "Alguna fuente de precios ha fallado" && exit 1
